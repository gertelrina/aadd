[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aadd"
version = "3.1.0"
description = "Automatic Audio Degradation Detection: per-second detection of noise, clipping, band-limiting, pitch/time artifacts in speech"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arina Gertel" }]
requires-python = ">=3.10"
keywords = ["audio", "speech", "quality", "degradation", "detection", "spectrogram", "cnn"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "torchvision>=0.16",
  "librosa>=0.10,<1.0",
  "soundfile>=0.12",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "tqdm>=4.60",
  "transformers>=4.40",   # v3 (Whisper encoder)
  "soxr>=0.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
train = ["audiomentations>=0.38", "scikit-learn>=1.3", "pyyaml>=6"]
dev = ["pytest>=7", "ruff>=0.4"]
all = ["aadd[app,train,dev]"]

[project.scripts]
aadd = "aadd.cli:main"

[project.urls]
Homepage = "https://github.com/gertelrina/aadd"
Issues = "https://github.com/gertelrina/aadd/issues"

[tool.setuptools.packages.find]
include = ["aadd*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
